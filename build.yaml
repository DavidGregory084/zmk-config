# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: raytac_mdbt50q_rx
    snippet: mdbt50q-nosd
    shield: lily58_dongle
    artifact-name: raytac_dongle
  - board: raytac_mdbt50q_rx
    snippet: mdbt50q-nosd
    shield: settings_reset
    artifact-name: raytac_settings_reset
  - board: nice_nano_v2
    snippet: nrf52840-nosd
    shield: lily58_left nice_view_adapter nice_view_custom
    artifact-name: lily58_left_central
  - board: nice_nano_v2
    snippet: nrf52840-nosd
    shield: lily58_left nice_view_adapter nice_view_custom
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: lily58_left_peripheral
  - board: nice_nano_v2
    snippet: nrf52840-nosd
    shield: lily58_right nice_view_adapter nice_view_custom
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: lily58_right
  - board: nice_nano_v2
    snippet: nrf52840-nosd
    shield: settings_reset
    artifact-name: nice_nano_settings_reset
